version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: SQLServer

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"

    ports:
      - "4000:1433"

    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: